backend:
  name: github
  repo: mbcube/malinki
  branch: blog

media_folder: src/images
public_folder: /src/images

i18n:
  structure: multiple_files
  locales: [fr, en]
  default_locale: fr

collections:
  # ─── Projects ─────────────────────────────────────────────────────────────
  - name: projects
    label: Projects
    icon: movie
    folder: src/content/projects
    create: true
    extension: md
    format: frontmatter
    i18n: true
    path: "{{slug}}/{{locale}}"
    identifier_field: slug
    summary: "{{title}}"
    fields:
      - { name: slug, label: Slug, widget: string, i18n: duplicate }
      - { name: title, label: Title, widget: string, i18n: true }
      - {
          name: clientName,
          label: Client Name,
          widget: string,
          required: false,
          i18n: true,
        }
      - {
          name: agencyName,
          label: Agency Name,
          widget: string,
          required: false,
          i18n: true,
        }
      - {
          name: shortDescription,
          label: Short Description,
          widget: text,
          i18n: true,
        }
      - name: mainVideo
        label: Main Video
        widget: object
        required: false
        i18n: duplicate
        fields:
          - { name: url, label: URL, widget: string }
          - name: type
            label: Type
            widget: select
            options:
              - { label: MP4, value: mp4 }
              - { label: YouTube, value: youtube }
              - { label: Vimeo, value: vimeo }
          - {
              name: isPortrait,
              label: Portrait Format,
              widget: boolean,
              required: false,
              default: false,
            }
      - {
          name: mainImageUrl,
          label: Main Image Filename,
          widget: string,
          required: false,
          i18n: duplicate,
        }
      - name: details
        label: Credits
        widget: list
        required: false
        i18n: true
        fields:
          - { name: label, label: Role, widget: string, i18n: true }
          - { name: value, label: Name, widget: string, i18n: duplicate }
      - name: additionalVideos
        label: Additional Videos
        widget: list
        required: false
        i18n: duplicate
        fields:
          - { name: url, label: URL, widget: string }
          - name: type
            label: Type
            widget: select
            options:
              - { label: MP4, value: mp4 }
              - { label: YouTube, value: youtube }
              - { label: Vimeo, value: vimeo }
          - {
              name: isPortrait,
              label: Portrait Format,
              widget: boolean,
              required: false,
              default: false,
            }
      - name: behindTheScenes
        label: Behind the Scenes
        widget: object
        required: false
        i18n: duplicate
        fields:
          - name: portrait
            label: Portrait Photos
            widget: list
            field: { name: filename, label: Filename, widget: string }
          - name: landscape
            label: Landscape Photos
            widget: list
            field: { name: filename, label: Filename, widget: string }
      - name: galleryImages
        label: Gallery Images
        widget: list
        required: false
        i18n: duplicate
        field: { name: filename, label: Filename, widget: string }
      - {
          name: publishedAt,
          label: Published At,
          widget: string,
          required: false,
          i18n: duplicate,
        }

