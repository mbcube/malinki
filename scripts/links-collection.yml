  - name: links
    label: Bio Links
    icon: link
    folder: src/content/links
    create: false
    extension: md
    format: frontmatter
    i18n: true
    identifier_field: title
    summary: "{{locale}} Bio links"
    fields:
      - { name: title, label: Page Title, widget: string, i18n: true }
      - { name: description, label: Description, widget: string, i18n: true }
      - { name: profile, label: Profile Name, widget: string, i18n: true }
      - name: links
        label: Links
        widget: list
        i18n: true
        fields:
          - { name: title, label: Link Title, widget: string }
          - { name: url, label: URL, widget: string }
          - { name: image, label: Image Filename, widget: string, required: false }
          - { name: imageAlt, label: Image Alt Text, widget: string, required: false }
          - { name: featured, label: Featured Image Card, widget: boolean, required: false, default: false }
